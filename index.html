/* myihsan.app · one scroll is one day: the Kaca (glass) sky follows the scroll from Subuh to Isyak, the app's real screens fly in and
   out as shaded three.js phones, and every lesson area is a carousel of its features. Fonts are the app's own (no third-party requests). */
@font-face{font-family:"Fraunces";src:url(app/fonts/fraunces-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Fraunces";src:url(app/fonts/fraunces-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Figtree";src:url(app/fonts/figtree-latin-400-normal.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Figtree";src:url(app/fonts/figtree-latin-600-normal.woff2) format("woff2");font-weight:600 800;font-display:swap}
@font-face{font-family:"Amiri";src:url(app/fonts/amiri-arabic-400-normal.woff2) format("woff2");font-display:swap}
:root{--fg:#fff;--mut:rgba(255,255,255,.80);--mut2:rgba(255,255,255,.66);--gold:#F1D58A;--glass:rgba(14,18,30,.52);--glass2:rgba(255,255,255,.10);
 --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.28);--blur:blur(26px) saturate(1.5);--ez:cubic-bezier(.22,1,.36,1);
 --f-d:"Fraunces",Georgia,serif;--f-b:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{background:#1A2650;scroll-behavior:smooth}
body{margin:0;color:var(--fg);font-family:var(--f-b);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--gold)}
button{font:inherit;color:inherit}
[data-en]{display:none} html[lang="en"] [data-ms]{display:none} html[lang="en"] [data-en]{display:revert}

/* sky + stage */
#sky{position:fixed;inset:0;z-index:-3;background:linear-gradient(#1A2650,#4D5A8A 42%,#B98AA3 78%,#F0C4A0)}
#gl{position:fixed;inset:0;z-index:-2;width:100%;height:100%;display:block;pointer-events:none}
#masjid{position:fixed;left:0;right:0;bottom:0;height:min(15vh,130px);z-index:-1;pointer-events:none;display:flex;flex-direction:column;justify-content:flex-end}
#masjid svg{width:auto;height:100%;display:block;margin:0 auto;max-width:100%}
#masjid:after{content:"";display:block;height:min(2.4vh,22px);background:rgba(12,10,24,.62)}
.nogl #gl{display:none}

/* header + clock */
header.top{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);transition:background .3s}
header.top.solid{background:rgba(8,12,28,.55);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-bottom:1px solid var(--line)}
#clock,#rail{transition:opacity .35s}
body.late #clock,body.late #rail{opacity:0;pointer-events:none}
header.top .in{display:flex;align-items:center;gap:12px;padding:12px max(18px,env(safe-area-inset-left,0px))}
header.top .brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--fg)}
header.top img{width:34px;height:34px;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.3)}
header.top b{font-family:var(--f-d);font-weight:600;font-size:20px;letter-spacing:-.2px}
header.top nav{margin-left:auto;display:flex;gap:8px;align-items:center}
.glass{background:var(--glass);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px -14px rgba(0,0,0,.45)}
.lang{border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border-radius:14px;padding:13px 20px;font-size:16px;border:0;cursor:pointer;transition:transform .2s var(--ez)}
.btn:hover{transform:translateY(-1px)}
.btn.gold{background:linear-gradient(180deg,#F6DE9C,#E2BF66);color:#1A1405;box-shadow:0 8px 22px -8px rgba(241,213,138,.6)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.ghost{color:var(--fg)}
#clock{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:19;border-radius:999px;padding:7px 16px 7px 12px;display:flex;gap:10px;align-items:center;font-size:14px;white-space:nowrap}
#clock .t{font-weight:800;font-variant-numeric:tabular-nums;font-size:16px}
#clock .p{letter-spacing:.14em;font-weight:700;font-size:12px;color:var(--gold)}
#clock .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
#rail{position:fixed;right:max(14px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);z-index:19;display:flex;flex-direction:column;gap:6px;padding:8px 6px;border-radius:999px}
#rail a{display:block;width:30px;height:30px;border-radius:50%;text-decoration:none;font-size:10px;font-weight:800;letter-spacing:.04em;color:var(--mut);display:grid;place-items:center;transition:background .3s,color .3s}
#rail a.on{background:var(--gold);color:#1A1405}

/* sections: tall, with a sticky glass card so each hour has time to breathe */
main{position:relative}
.hour{position:relative;min-height:170vh}
.hour.short{min-height:120vh}
.stick{min-width:0;width:100%;position:sticky;top:clamp(110px,16vh,170px);padding:0 max(22px,env(safe-area-inset-left,0px));max-width:1240px;margin:0 auto}
.card{min-width:0;max-width:560px;border-radius:28px;padding:28px 28px 24px}
.kick{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:0 0 12px}
.kick i{font-style:normal;font-size:20px;letter-spacing:0}
h1,h2{font-family:var(--f-d);font-weight:400;letter-spacing:-.02em;line-height:1.04;margin:0 0 12px;text-wrap:balance}
h1{font-size:clamp(42px,6.6vw,82px)}
h2{font-size:clamp(32px,4.4vw,54px)}
h1 em,h2 em{font-style:normal;color:var(--gold)}
.lead{font-size:clamp(17px,1.9vw,20px);color:var(--mut);margin:0 0 20px;max-width:46ch}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.soon{font-size:14px;color:var(--mut2)}
.ayah{margin:22px 0 0;color:var(--mut2);font-size:14px;max-width:48ch}
.ayah .ar{display:block;font-family:"Amiri","Scheherazade New",serif;font-size:26px;color:var(--fg);direction:rtl;text-align:left;margin-bottom:6px;line-height:1.6}
.scrollhint{margin-top:22px;font-size:13px;color:var(--mut2);display:flex;gap:8px;align-items:center}
.scrollhint .ms{display:inline-block;flex:0 0 auto;width:18px;height:28px;border:2px solid var(--line2);border-radius:10px;position:relative}
.scrollhint .ms:after{content:"";position:absolute;left:50%;top:5px;width:4px;height:6px;margin-left:-2px;border-radius:2px;background:var(--gold);animation:wheel 1.6s infinite}
@keyframes wheel{0%{opacity:0;transform:translateY(0)}30%{opacity:1}100%{opacity:0;transform:translateY(9px)}}

/* feature carousel */
.car{margin-top:4px}
.car .bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.car .ct{font-size:13px;color:var(--mut2);font-variant-numeric:tabular-nums;margin-right:auto}
.car .nav{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:var(--glass2);cursor:pointer;display:grid;place-items:center;font-size:18px;transition:background .2s}
.car .nav:hover{background:rgba(255,255,255,.2)}
.car .play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:none;cursor:pointer;font-size:13px}
.car .row{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none;mask-image:linear-gradient(90deg,#000 88%,transparent)}
.car .row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;scroll-snap-align:start;border:1px solid var(--line);background:var(--glass2);border-radius:16px;padding:10px 14px;cursor:pointer;text-align:left;min-width:150px;max-width:210px;transition:background .25s,border-color .25s,transform .25s var(--ez)}
.chip b{display:block;font-size:15px;line-height:1.25}
.chip small{display:block;color:var(--mut2);font-size:12.5px;line-height:1.35;margin-top:3px}
.chip i{font-style:normal;font-size:20px;display:block;margin-bottom:4px}
.chip[aria-pressed="true"]{background:rgba(241,213,138,.18);border-color:var(--gold);transform:translateY(-2px)}
.now{margin:14px 0 0;min-height:3.2em}
.now b{font-family:var(--f-d);font-weight:600;font-size:24px;display:block;line-height:1.2}
.now span{color:var(--mut);font-size:15px}
.fb{display:none}
.nogl .fb{display:block;margin-top:16px;width:200px;border-radius:22px;border:1px solid var(--line2);box-shadow:0 20px 40px rgba(0,0,0,.4)}

/* themes */
.ths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.ths button{border:1px solid var(--line);border-radius:14px;padding:8px 6px;cursor:pointer;background:var(--glass2);font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px}
.ths button span{width:100%;height:26px;border-radius:8px;border:1px solid rgba(255,255,255,.25)}
.ths button[aria-pressed="true"]{border-color:var(--gold);background:rgba(241,213,138,.16)}

/* every feature */
.all{padding:12vh max(22px,env(safe-area-inset-left,0px)) 6vh;max-width:1240px;margin:0 auto}
.all .card{max-width:none}
.all .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:6px 0 18px}
.all input{flex:1 1 260px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.08);padding:12px 16px;color:var(--fg);font-size:16px;outline:none}
.all input:focus{border-color:var(--gold)}
.all .n{color:var(--mut2);font-size:14px}
.cols{columns:3 300px;column-gap:16px}
.grp{break-inside:avoid;margin:0 0 16px;border-radius:20px;padding:16px 18px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.grp h3{margin:0 0 8px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);display:flex;gap:8px;align-items:center}
.grp h3 i{font-style:normal;font-size:18px;letter-spacing:0}
.grp ul{list-style:none;margin:0;padding:0}
.grp li{padding:5px 0;border-top:1px solid rgba(255,255,255,.07);font-size:15px;display:flex;gap:8px}
.grp li:first-child{border-top:0}
.grp li span{color:var(--mut2)}
.grp li.hide,.grp.hide{display:none}

/* promise + web + footer */
.prom{list-style:none;padding:0;margin:6px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px}
.prom li{display:flex;gap:12px}
.prom li i{font-style:normal;font-size:22px;line-height:1.3}
.prom b{display:block}
.prom span{color:var(--mut2);font-size:14.5px}
footer{position:relative;padding:40px max(22px,env(safe-area-inset-left,0px)) calc(150px + env(safe-area-inset-bottom,0px));max-width:1240px;margin:0 auto;color:var(--mut);font-size:14px}
footer .in{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;border-radius:20px;padding:16px 20px}
footer .sp{margin-left:auto}

.btn:focus-visible,.lang:focus-visible,a:focus-visible,.chip:focus-visible,.nav:focus-visible,.ths button:focus-visible,.play:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
@media (max-width:860px){
 .stick{top:auto;bottom:0;position:sticky}
 .hour{min-height:180vh;display:flex;flex-direction:column;justify-content:flex-end}
 .hour .stick{padding-top:52vh;padding-bottom:16px}
 .card{padding:20px 18px 18px;border-radius:24px}
 #rail{display:none}
 .prom{grid-template-columns:1fr}
 .ths{grid-template-columns:repeat(4,minmax(0,1fr))}
 header.top nav .btn{display:none}
 #clock{top:calc(58px + env(safe-area-inset-top,0px))}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.scrollhint .ms:after{animation:none}}
</style>
</head>

  sunEl.style.background = night ? "radial-gradient(circle at 62% 38%, transparent 0 22px, " + c + " 23px 30px, transparent 31px)" : "radial-gradient(circle, #FFF6DA 0 26px, " + c + " 28px, rgba(255,255,255,0) 42px)";
  sunEl.style.boxShadow = night ? "none" : "0 0 120px 40px " + c.replace("rgb", "rgba").replace(")", ",.35)");
  stars.style.opacity = night ? Math.min(0.8, Math.abs(hourNow - (hourNow < 12 ? 6.2 : 19.35)) * 0.9) : 0; }
// no WebGL: the sky still runs without phones
function skyOnly(){ (function loop(){ hourNow += (hourTarget - hourNow) * 0.15; var sk = skyAt(hourNow); var sp = sunXY(hourNow);
  skyEl.style.background = "linear-gradient(" + css(sk[0]) + "," + css(sk[1]) + " 42%," + css(sk[2]) + " 78%," + css(sk[3]) + ")"; drawSun(sp, sk, isNight(hourNow)); requestAnimationFrame(loop); })(); }

/* ============ scroll → hour, active section, rail ============ */
var lastY = scrollY;
function onScroll(){ var y = scrollY; hourTarget = hourAtScroll(y); var mid = innerHeight * 0.5, si = activeSi;
  secEls.forEach(function(el){ var r = el.getBoundingClientRect(); if(r.top <= mid && r.bottom > mid) si = +el.dataset.si; });
  var past = document.getElementById("semua").getBoundingClientRect().top < innerHeight * 0.4;
  if(si !== activeSi || past !== onScroll.past){ var dir = y >= lastY ? 1 : -1; activeSi = si; onScroll.past = past; if(GL){ if(past) GL.setActive(-1, dir); else GL.setActive(si, dir); } activateCarousel(si); }
  var hk = SECTIONS[activeSi].hour; rail.querySelectorAll("a").forEach(function(a){ a.classList.toggle("on", a.dataset.h === hk); });
  document.querySelector("header.top").classList.toggle("solid", past); document.body.classList.toggle("late", past);
  clockT.textContent = fmt(hourTarget); clockP.textContent = prayerOf(hourTarget); lastY = y; }
addEventListener("scroll", onScroll, {passive:true});
addEventListener("resize", function(){ ANC = anchors(); onScroll(); });

/* ============ carousels ============ */
var auto = {si:-1, timer:0, paused:RM};
function carOf(si){ return document.querySelector('section[data-si="' + si + '"] .car'); }
function select(si, i, fromUser){ var s = SECTIONS[si], n = s.ring.length; i = ((i % n) + n) % n; s.cur = i;
  var c = carOf(si); if(c){ c.querySelectorAll(".chip").forEach(function(b, j){ b.setAttribute("aria-pressed", j === i); });
    var b = c.querySelector('.chip[data-i="' + i + '"]'); if(b){ var row = c.querySelector(".row"); row.scrollTo({left:b.offsetLeft - row.offsetLeft - 8, behavior:RM ? "auto" : "smooth"}); }
    c.querySelector(".ct").textContent = (i + 1) + " / " + n; refreshNow(si); }
  if(GL){ var R = GL.ring(si); if(R){ var k = R.idx, d = i - (((k % n) + n) % n); if(d > n / 2) d -= n; if(d < -n / 2) d += n; R.idx = k + d; } }
  if(fromUser){ auto.paused = true; setPlay(); } }
function refreshNow(si){ if(si == null) si = activeSi; var s = SECTIONS[si]; var c = carOf(si); if(!c || s.cur == null) return; var r = s.ring[s.cur]; var en = de.lang === "en";
  c.querySelector(".now").innerHTML = "<b>" + (en ? r[2] : r[1]) + "</b><span>" + (en ? r[4] : r[3]) + "</span>"; }
function setPlay(){ document.querySelectorAll(".play").forEach(function(b){ b.textContent = auto.paused ? "▶" : "❚❚"; }); }
function activateCarousel(si){ auto.si = si; }
setInterval(function(){ if(auto.paused || document.hidden) return; var s = SECTIONS[auto.si]; if(!s || !s.lesson) return; select(auto.si, (s.cur || 0) + 1, false); }, 2600);
SECTIONS.forEach(function(s, si){ var c = carOf(si); if(!c) return; s.cur = 0;
  c.querySelectorAll(".chip").forEach(function(b){ b.onclick = function(){ select(si, +b.dataset.i, true); }; });
  c.querySelector(".prev").onclick = function(){ select(si, s.cur - 1, true); }; c.querySelector(".next").onclick = function(){ select(si, s.cur + 1, true); };
  c.querySelector(".play").onclick = function(){ auto.paused = !auto.paused; setPlay(); };
  c.addEventListener("keydown", function(e){ if(e.key === "ArrowRight"){ select(si, s.cur + 1, true); e.preventDefault(); } if(e.key === "ArrowLeft"){ select(si, s.cur - 1, true); e.preventDefault(); } });
  // swipe on the card moves the carousel too
  var x0 = null; c.addEventListener("pointerdown", function(e){ x0 = e.clientX; }); c.addEventListener("pointerup", function(e){ if(x0 == null) return; var d = e.clientX - x0; x0 = null; if(Math.abs(d) > 60 && !e.target.closest(".row")) select(si, s.cur + (d < 0 ? 1 : -1), true); });
  select(si, 0, false); });
// themes: pick one of the 8 home screens
document.querySelectorAll(".ths button").forEach(function(b){ b.onclick = function(){ var si = +b.closest("section").dataset.si; document.querySelectorAll(".ths button").forEach(function(x){ x.setAttribute("aria-pressed", x === b); }); SECTIONS[si].cur = +b.dataset.th; if(GL){ var R = GL.ring(si), n = 8, k = R.idx, i = +b.dataset.th, d = i - (((k % n) + n) % n); if(d > 4) d -= n; if(d < -4) d += n; R.idx = k + d; } }; });

/* ============ start ============ */
var l0 = "ms"; try{ l0 = localStorage.getItem("ihsan_site_lang") || (/^(ms|id)/i.test(navigator.language) ? "ms" : "en"); }catch(e){}
setLang(l0); setPlay();
var testGL = document.createElement("canvas"); var ok = !!(window.WebGLRenderingContext && (testGL.getContext("webgl2") || testGL.getContext("webgl")));
if(ok) loadThree(function(){ try{ startGL(); }catch(e){ console.error(e); de.classList.add("nogl"); skyOnly(); } if(GL){ var th = SECTIONS.findIndex(function(s){ return s.themes; }); GL.ring(th).idx = 6; } onScroll.past = null; activeSi = -1; onScroll(); });
else { de.classList.add("nogl"); skyOnly(); onScroll(); }
