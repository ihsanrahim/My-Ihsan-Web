/* ---------- LAJUR: kira secara turus ---------- */
function binaLajur(kad,t,q,i){
  const r = rekod(t.id);
  const v = r.jawapan[q.id] || {};
  const siap = sudahSemak(t,q);
  const betul = betulJawab(q, r.jawapan[q.id]);
  const pos = posDigit(q);
  const lebar = q.a.length;
  const pad = s => String(s).padStart(lebar, " ");
  const barisAtas = pad(q.atas), barisBawah = pad(q.bawah);

  if(lajurKursor[q.id] === undefined){
    // kali pertama sahaja: mula pada kotak kosong paling kanan
    const kosong = pos.slice().reverse().find(n => v[n] == null);
    lajurKursor[q.id] = (kosong !== undefined) ? kosong : pos[pos.length-1];
  }
  const kursor = lajurKursor[q.id];

  const wrap = document.createElement("div"); wrap.className = "lajurWrap";
  const lj = document.createElement("div"); lj.className = "lajur";

  function barisSel(teks, op, tandaWang){
    const b = document.createElement("div"); b.className = "lajurBaris";
    const o = document.createElement("span"); o.className = "op"; o.textContent = op || "";
    b.appendChild(o);
    if(q.wang){
      const w = document.createElement("span"); w.className="sel simbol";
      w.textContent = tandaWang === false ? "" : "RM";
      b.appendChild(w);
    }
    for(const ch of teks){
      const c = document.createElement("span");
      c.className = "sel" + (ch === "." ? " titik" : "");
      c.textContent = ch === " " ? "" : ch;
      b.appendChild(c);
    }
    return b;
  }
  lj.appendChild(barisSel(barisAtas, "", true));
  lj.appendChild(barisSel(barisBawah, q.op, !q.bawahBiasa));
  const rule = document.createElement("div"); rule.className = "rule";
  lj.appendChild(rule);

  const jawapanBaris = document.createElement("div"); jawapanBaris.className = "lajurBaris";
  const kosongOp = document.createElement("span"); kosongOp.className = "op"; jawapanBaris.appendChild(kosongOp);
  if(q.wang){ const w = document.createElement("span"); w.className="sel simbol"; w.textContent="RM"; jawapanBaris.appendChild(w); }
  q.a.split("").forEach((ch,n)=>{
    if(ch === "."){
      const d = document.createElement("span"); d.className = "sel titik"; d.textContent = ".";
      jawapanBaris.appendChild(d); return;
    }
    const b = document.createElement("button");
    b.className = "kotakDigit";
    if(siap) b.classList.add(v[n] === q.a[n] ? "betul" : "salah");
    else if(n === kursor) b.classList.add("kursor");
    b.textContent = v[n] != null ? v[n] : "";
    b.onclick = ()=>{ lajurKursor[q.id] = n; isiSoalan(kad,t,q,i); };
    jawapanBaris.appendChild(b);
  });
  lj.appendChild(jawapanBaris);
  wrap.appendChild(lj);
  kad.appendChild(wrap);

  const arah = document.createElement("p");
  arah.className = "padanArahan";
  arah.textContent = "Mula dari kotak paling kanan. Tekan mana-mana kotak untuk pindah.";
  kad.appendChild(arah);

  const pad9 = document.createElement("div"); pad9.className = "numpad";
  ["1","2","3","4","5","6","7","8","9","0"].forEach(n=>{
    const b = document.createElement("button"); b.className = "numKey"; b.textContent = n;
    b.onclick = ()=>{
      const baru = Object.assign({}, v);
      baru[lajurKursor[q.id]] = n;
      // pindah ke kotak kosong seterusnya ke kiri
      const idx = pos.indexOf(lajurKursor[q.id]);
      lajurKursor[q.id] = idx > 0 ? pos[idx-1] : pos[idx];
      simpanJawapan(t,q,i,baru);
    };
    pad9.appendChild(b);
  });
  const del = document.createElement("button"); del.className = "numKey padam"; del.textContent = "⌫";
  del.onclick = ()=>{
    const baru = Object.assign({}, v);
    let target = lajurKursor[q.id];
    if(baru[target] == null){
      const idx = pos.indexOf(target);
      if(idx < pos.length-1) target = pos[idx+1];
    }
    delete baru[target];
    lajurKursor[q.id] = target;
    r.jawapan[q.id] = baru; tulis();
    isiSoalan(kad,t,q,i); segarHud(t); segarSemak(t);
  };
  pad9.appendChild(del);
  kad.appendChild(pad9);
}

/* ---------- simpan + segarkan ---------- */
// Memilih jawapan TIDAK menanda betul/salah. Tanda hanya muncul selepas Semak.
function simpanJawapan(t,q,i,nilai){
  const r = rekod(t.id);
  if(nilai === undefined) delete r.jawapan[q.id]; else r.jawapan[q.id] = nilai;
  delete r.disemak[q.id];        // jawapan berubah -> tanda lama tidak sah lagi
  kemasHarian(); tulis();
  const kad = soalanEls[q.id];
  if(kad) isiSoalan(kad,t,q,i);
  segarHud(t); segarSemak(t);
  if(window.GAME_HOOK) window.GAME_HOOK(t,q,nilai);
}

// Semak: tanda semua soalan yang sudah dijawab.
function semakSemua(t){
  const r = rekod(t.id);
  let baru = 0, betulBaru = 0;
  t.soalan.forEach(q=>{
    const v = r.jawapan[q.id];
    if(!siapJawab(q,v)) return;
    const ok = betulJawab(q,v);
    if(!r.disemak[q.id]){ baru++; r.cubaan[q.id] = (r.cubaan[q.id] || 0) + 1; if(!ok) r.salahN[q.id] = (r.salahN[q.id] || 0) + 1; }   // 0.6.9: attempts and wrong tries per question
    r.disemak[q.id] = true;
    if(ok) betulBaru++;
    // Skor cubaan pertama direkod pada semakan PERTAMA soalan itu sahaja.
    if(!Object.prototype.hasOwnProperty.call(r.pertama, q.id)) r.pertama[q.id] = ok && !(q.j === "baca" && v === "h");   // ½ counts for the beads, not as first try
  });
  tulis();
  bunyi(baru && betulBaru === baru ? "siap" : baru ? "betul" : "salah");
  t.soalan.forEach((q,i)=>{ const kad = soalanEls[q.id]; if(kad) isiSoalan(kad,t,q,i); });
  segarHud(t); segarSemak(t);
  return baru;
}

function segarSemak(t){
  if(!semakEl) return;
  const k = kiraTopik(t);
  semakEl.innerHTML = "";
  const h = document.createElement("h3"); h.textContent = "Semak — " + t.nama; semakEl.appendChild(h);
  const p = document.createElement("p"); p.className = "kecil";
  p.textContent = k.jawab < k.jum
    ? (k.jum - k.jawab) + " soalan belum dijawab."
    : k.semak < k.jawab ? "Semua sudah dijawab. Tekan Semak untuk lihat markah."
    : k.betul === k.jum ? "🎉 Semua betul. Syabas!"
    : "Tekan nombor merah, betulkan, kemudian Semak sekali lagi.";
  semakEl.appendChild(p);

  const st = document.createElement("div"); st.className = "statKotak";
  st.innerHTML = `<div><b>${k.betul}/${k.jum}</b><span>betul sekarang</span></div>
    <div><b>${k.pBetul}/${k.pJawab}</b><span>cubaan pertama</span></div>`;
  semakEl.appendChild(st);

  const semakBar = document.createElement("div"); semakBar.className = "semakBar";
  const sb = document.createElement("button"); sb.className = "btn utama";
  const belum = k.jawab - k.semak;
  sb.textContent = BAHASA === "en" ? (belum ? "✔ Check " + belum + " answers" : "✔ Check answers") : (belum ? "✔ Semak " + belum + " jawapan" : "✔ Semak jawapan");
  sb.disabled = !k.jawab;
  sb.onclick = ()=> semakSemua(t);
  semakBar.appendChild(sb);
  semakEl.insertBefore(semakBar, semakEl.querySelector(".statKotak"));

  const nav = document.createElement("div"); nav.className = "nav";
  const atas = document.createElement("button"); atas.className = "btn";
  atas.textContent = "↑ Naik ke atas";
  atas.onclick = ()=> window.scrollTo({top:0,behavior:"smooth"});
  const reset = document.createElement("button"); reset.className = "btn emas";
  reset.textContent = "🧹 Padam semua";
  reset.onclick = ()=> padamTopik(t, ()=> pergi({tab:"kuiz"}));
  nav.appendChild(atas); nav.appendChild(reset);
  semakEl.appendChild(nav);
}

/* ============================================================
   MULA
   ============================================================ */
function ambil(u){ return new Promise((ok, no)=>{ const x = new XMLHttpRequest(); x.open("GET", u); x.onload = ()=>{ if(x.status === 200 || (x.status === 0 && x.responseText)) { try{ ok(JSON.parse(x.responseText)); }catch(e){ no(e); } } else no(new Error(u)); }; x.onerror = ()=> no(new Error(u)); x.send(); }); }
async function muatPek(id){
  const [N, K] = await Promise.all([ambil("packs/" + id + ".nota.json"), ambil("packs/" + id + ".kuiz.json")]);
  return {N, K};
}
function keluar(){ try{ if(window.parent && window.parent !== window){ window.parent.postMessage({silibus:"close", pek:PEK}, "*"); return; } }catch(e){} history.back(); }
// Nota: a topic counts as read once the reader reaches the end
function tandaBaca(t, m){ const cek = ()=>{ if(!document.body.contains(m)){ window.removeEventListener("scroll", cek); return; }
    if(window.innerHeight + window.scrollY >= document.body.scrollHeight - 40){ const r = rekod(t.id); if(!r.baca){ r.baca = true; tulis(); } window.removeEventListener("scroll", cek); } };
  window.addEventListener("scroll", cek, {passive:true}); setTimeout(cek, 400); }
// Android Back inside My Ihsan: notes sheet -> game -> topic -> subject -> leave
window.SILIBUS_BACK = function(){ const nl = document.querySelector(".notaLapis"); if(nl){ nl.remove(); return true; }
  if(document.querySelector(".gm")){ try{ window.GAME_HOOK = null; }catch(e){} pergi({skrin:"subjek", topik:null}); return true; }
  if(laluan.skrin === "topik"){ pergi({skrin:"subjek", topik:null}); return true; } return false; };
// ---------- 📝 Ujian Contoh (spec §4.8): paper seed = date + child (or "Kertas baharu"); slip, history, Indeks Sedia ----------
async function mulaUjian(){
  const ids = SEDIA.TULIS.concat(["sedia-lisan"]), packs = {};
  const got = await Promise.all(ids.map(id=> muatPek(id).catch(()=>null)));
  got.forEach((x,k)=>{ if(x) packs[ids[k]] = {id:ids[k], nama:x.N.nama, ikon:x.N.ikon, topik:x.N.topik.map((t,i)=>Object.assign({}, t, {soalan:(x.K.topik[i]||{}).soalan||[], petikan:(x.K.topik[i]||{}).petikan||{}}))}; });
  const d = new Date(), seed = QS.get("kertas") || (tarikhKunci(d) + "-" + ANAK);
  if(simpan.__kertas !== seed){ simpan = {__kertas: seed, __jawi: simpan.__jawi, __bunyi: simpan.__bunyi, __tema: simpan.__tema}; tulis(); }
  META.ujian = {ikon:"📝", sk:"UJ", warna:"#E8A33D"};
  DATA = {murid:NAMA_ANAK, kelas:"", tempoh:"", tajuk:"Ujian Contoh", subjek:[{id:"ujian", nama:"📝 Ujian Contoh Tahun 1", sedia:true, topik: SEDIA.build(packs, seed)}]};
  laluan = {skrin:"subjek", sub:"ujian", topik:null, tab:"kuiz", fokus:null}; lukis();
}
function tunjukSlip(){ const t = DATA.subjek[0].topik, ov = document.createElement("div"); ov.className = "notaLapis"; const b = document.createElement("div"); b.className = "notaHelai";
  const x = document.createElement("button"); x.className = "btn"; x.textContent = "✕"; x.onclick = ()=> ov.remove(); b.appendChild(x);
  b.appendChild(SEDIA.slip(t, simpan.__kertas, (pek, topik)=>{ location.href = "exam.html?pek=" + encodeURIComponent(pek) + "&mod=nota&anak=" + encodeURIComponent(ANAK) + "&nama=" + encodeURIComponent(NAMA_ANAK) + "&topik=" + encodeURIComponent(topik); }));
  ov.appendChild(b); ov.onclick = e=>{ if(e.target === ov) ov.remove(); }; document.body.appendChild(ov); }
function kertasBaru(){ const u = new URL(location.href); u.searchParams.set("kertas", tarikhKunci(new Date()) + "-" + Date.now().toString(36)); location.replace(u.toString()); }
function lihatNota(t){ const ov = document.createElement("div"); ov.className = "notaLapis"; const b = document.createElement("div"); b.className = "notaHelai";
  const x = document.createElement("button"); x.className = "btn"; x.textContent = "✕"; x.onclick = ()=> ov.remove(); b.appendChild(x); b.appendChild(panelNota(t)); ov.appendChild(b);
  ov.onclick = e=>{ if(e.target === ov) ov.remove(); }; document.body.appendChild(ov); }
(async function mula(){
  pakaiTema();
  document.getElementById("app").innerHTML = '<p class="memuat">⏳ Memuatkan…</p>';
  try{
    if(MOD === "ujian"){ await mulaUjian(); return; }
    const [{N, K}, kamus] = await Promise.all([muatPek(PEK), ambil("kamus.json").catch(()=>({}))]);
    KAMUS = kamus.kamus || kamus || {};
    PACK = N; BAHASA = N.bahasa || "ms";
    META[N.id] = {ikon:N.ikon, sk:N.sk, warna:N.warna};
    if(BAHASA === "ms"){ SUBJEK_PI.add(N.id); if(!/-jawi$/.test(N.id) || N.upkk) SUBJEK_JAWI.add(N.id); NAMA_JAWI[N.id] = NAMA_JAWI[N.id] || ""; }
    if(simpan.__jawi === undefined && !TEMA_APL && (N.upkk || /-(pi|jawi|akhlak|tauhid|feqah|hafazan|kafa|sirah|tajwid|imlak|khat)$/.test(N.id))) jawiMod = true;   // 0.5.64/65: KAFA packs are written in full Jawi
    const KAFA_JN = {"t1-akhlak":"اخلاق (كفا)", "t1-tauhid":"توحيد (كفا)", "t1-feqah":"فقه (كفا)", "t1-hafazan":"حفظن (كفا)", "t1-jawi-kafa":"جاوي (كفا)", "t1-arab-kafa":"بهاس عرب (كفا)", "t3-sirah":"سيره (كفا)", "t3-tajwid":"تجويد (كفا)", "t3-imlak":"املاء (كفا)", "t3-khat":"خط (كفا)"};
    for (const k of Object.keys(KAFA_JN)) for (const y of ["t2-", "t3-", "t4-", "t5-", "t6-"]) KAFA_JN[k.replace(/^t\d-/, y)] = KAFA_JN[k];
    Object.assign(KAFA_JN, {"t5-upkk-akidah":"عقيدة (UPKK)", "t5-upkk-ibadah":"عبادة (UPKK)", "t5-upkk-sirah":"سيره (UPKK)", "t5-upkk-adab":"اداب (UPKK)", "t5-upkk-jawi":"جاوي دان خط (UPKK)", "t5-upkk-arab":"بهاس عرب (UPKK)"});
    if(KAFA_JN[N.id]) NAMA_JAWI[N.id] = NAMA_JAWI[N.id] || KAFA_JN[N.id];   // 0.5.54: Years 4-6 PI words are in kamus.json, so PI opens in Jawi again
    if(BAHASA === "ar") document.body.classList.add("pekArab");
    DATA = {murid:NAMA_ANAK, kelas:"", tempoh:"", tajuk:N.nama, subjek:[{id:N.id, nama:N.nama, sedia:true, semak:N.semak,
      topik:N.topik.map((t,i)=>Object.assign({}, t, {soalan:(K.topik[i]||{}).soalan||[], petikan:(K.topik[i]||{}).petikan||{}}))}]};
    laluan = {skrin:"subjek", sub:N.id, topik:null, tab: MOD === "nota" ? "nota" : "kuiz", fokus:null};
    const lt = QS.get("topik"); if(lt && DATA.subjek[0].topik.some(t=>t.id===lt)) laluan = Object.assign(laluan, {skrin:"topik", topik:lt});
    lukis(); ringkas();
  }catch(e){ document.getElementById("app").innerHTML = '<p class="memuat">⚠️ Pek tidak dapat dimuatkan: ' + lindung(String(e && e.message || e)) + '</p>'; }
})();
